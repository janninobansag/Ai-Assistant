<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f4f0" />
    <title>Offline · LearnLoop</title>
    <style>
      :root {
        font-family:
          Geist,
          Aptos,
          Segoe UI,
          system-ui,
          sans-serif;
        color: #202421;
        background: #f5f4f0;
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100dvh;
        background: #f5f4f0;
      }
      main {
        max-width: 30rem;
        margin: 18vh auto;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(1.8rem, 7vw, 2.6rem);
        letter-spacing: -0.06em;
      }
      p {
        line-height: 1.7;
        color: #536158;
      }
      button {
        border: 0;
        border-radius: 0.5rem;
        background: #315dcb;
        color: #fff;
        font: inherit;
        font-weight: 650;
        padding: 0.85rem 1.3rem;
        transition: background-color 0.16s ease;
      }
      button:hover {
        background: #244aa8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Reconnect to the internet, then try again. Your private study data is never stored in the
        app cache.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
